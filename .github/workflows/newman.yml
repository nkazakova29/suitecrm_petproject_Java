name: Newman API Tests

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Newman and Allure Reporter
        run: npm install -g newman newman-reporter-allure

      - name: Run Postman collection
        run: |
          newman run postman/orangehrm_collection.json \
            -e postman/orangehrm_environment.json \
            --reporters cli,allure \
            --reporter-allure-resultsDir allure-results \
            --delay-request 300

      - name: Upload Allure Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: allure-results
