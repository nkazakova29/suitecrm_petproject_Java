name: Newman API Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Позволяет запускать тесты вручную из вкладки Actions

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Newman
        run: npm install -g newman

      - name: Run Postman collection
        run: |
          newman run postman/orangehrm_collection.json \
            -e postman/orangehrm_environment.json \
            --env-var "base_url=https://opensource-demo.orangehrmlive.com" \
            --env-var "login=Admin" \
            --env-var "password=admin123" \
            --delay-request 300
