name: Java Playwright Tests with Cloud SQL Proxy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 17

    - name: Setup Node.js (required for Playwright & Allure)
      uses: actions/setup-node@v5
      with:
        node-version: 20

    - name: Install Playwright browsers with deps
      run: npx playwright install --with-deps

    # Устанавливаем Allure CLI через npm (надежно и без PPA)
    - name: Install Allure CLI
      run: sudo npm install -g allure-commandline --save-dev

    # Скачиваем бинарник Cloud SQL Proxy
    - name: Download Cloud SQL Proxy
      run: |
        curl -o cloud_sql_proxy https://dl.google.com/cloudsql/cloud_sql_proxy.linux.amd64
        chmod +x cloud_sql_proxy

    - name: Configure Cloud SQL Proxy
      run: |
        echo "${{ secrets.CLOUD_SQL_CREDENTIALS_JSON }}" > cloud_sql_credentials.json
        chmod 600 cloud_sql_credentials.json

    - name: Start Cloud SQL Proxy
      run: |
        ./cloud_sql_proxy \
          -instances=guideflow-stage:europe-west1:guideflow-replica=tcp:5437 \
          -credential_file=cloud_sql_credentials.json &
        
        # Ждём, пока порт 5437 станет доступен
        for i in {1..15}; do
          nc -z localhost 5437 && break || sleep 1
        done

    - name: Run Maven tests
      run: mvn clean test -B
      continue-on-error: true # Позволяет перейти к сборке отчета, даже если тесты упадут

    - name: Generate Allure report
      if: always()
      run: |
        # Ищем папку с результатами (в target или в корне) и генерируем отчет
        if [ -d "target/allure-results" ]; then
          allure generate target/allure-results --clean -o target/allure-report
        elif [ -d "allure-results" ]; then
          allure generate allure-results --clean -o target/allure-report
        else
          echo "No allure results found!"
        fi

    - name: Upload Allure results
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: allure-results
        path: |
          target/allure-results
          allure-results
        missing-passthrough-failed: false

    - name: Upload Allure report
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: allure-report
        path: target/allure-report
