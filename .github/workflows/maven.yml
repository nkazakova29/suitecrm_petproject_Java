name: Java Playwright Tests with Cloud SQL Proxy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-24.04

    env:
      DB_HOST: localhost
      DB_PORT: 5437
      DB_NAME: guideflow
      DB_USER: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: temurin
        java-version: 17

    - name: Install system dependencies for Playwright
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          wget curl unzip \
          libnss3 libatk1.0-0 libcups2 libxcomposite1 libxrandr2 libgtk-3-0 \
          libpangocairo-1.0-0 libxss1 libgbm1 libwoff1 libx264-dev libavif-dev \
          libasound2t64 libpulse0

    - name: Setup Node.js (required for Playwright)
      uses: actions/setup-node@v3
      with:
        node-version: 20

    - name: Install Playwright browsers
      run: npx playwright install --with-deps

    - name: Configure Cloud SQL Proxy
      run: |
        echo "${{ secrets.CLOUD_SQL_CREDENTIALS_JSON }}" > cloud_sql_credentials.json
        chmod 600 cloud_sql_credentials.json

    - name: Start Cloud SQL Proxy
      run: |
        ./cloud_sql_proxy \
          guideflow-stage:europe-west1:guideflow-replica \
          --credentials-file=cloud_sql_credentials.json \
          --port=5437 &
        # Ждём 5 секунд, чтобы прокси поднялся
        sleep 5

    - name: Run Maven tests
      run: mvn clean test -B

    - name: Upload Allure results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: allure-results
        path: target/allure-results
