name: Java Playwright Tests with Cloud SQL Proxy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install Playwright browsers with deps
      run: npx playwright install --with-deps

    - name: Download Cloud SQL Proxy
      run: |
        curl -o cloud_sql_proxy https://dl.google.com/cloudsql/cloud_sql_proxy.linux.amd64
        chmod +x cloud_sql_proxy

    - name: Configure Cloud SQL Proxy
      run: |
        echo "${{ secrets.CLOUD_SQL_CREDENTIALS_JSON }}" > cloud_sql_credentials.json
        chmod 600 cloud_sql_credentials.json

    - name: Start Cloud SQL Proxy
      run: |
        ./cloud_sql_proxy \
          -instances=guideflow-stage:europe-west1:guideflow-replica=tcp:5437 \
          -credential_file=cloud_sql_credentials.json &
        
        for i in {1..15}; do
          nc -z localhost 5437 && break || sleep 1
        done

    - name: Run Maven tests
      run: mvn clean test -B
      continue-on-error: true 

    - name: Generate Allure Report
      if: always()
      run: mvn allure:report -B

    - name: Upload Allure results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-results
        path: allure-results
        if-no-files-found: ignore

    - name: Upload Allure report artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-report
        path: target/site/allure-maven-plugin
        if-no-files-found: ignore


    - name: Deploy Allure Report to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      if: always()
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: target/site/allure-maven-plugin
