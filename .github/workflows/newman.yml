name: Newman API Tests

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java (required for Allure report generation)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Newman and Allure tools
        run: npm install -g newman newman-reporter-allure allure-commandline --save-dev

      - name: Create results directory
        run: mkdir -p allure-results

      - name: Run Postman collection
        run: |
          newman run postman/orangehrm_collection.json \
            -e postman/orangehrm_environment.json \
            --reporters cli,allure \
            --reporter-allure-resultsDir allure-results \
            --delay-request 300

      - name: Generate Newman Allure HTML Report
        if: always()
        run: allure generate allure-results --clean -o allure-report

      - name: Upload Newman Allure Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-allure-report
          path: allure-report
          retention-days: 30

      - name: Deploy Newman Report to GitHub Pages (/api-report)
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
          destination_dir: api-report
          keep_files: true
